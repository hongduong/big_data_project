# Copied into $SPARK_HOME/conf/ of the stocklake/spark image (docker/spark/Dockerfile).
# Values follow Planning table 2.2. Per-job overrides go on the spark-submit command
# line (e.g. streaming jobs: --conf spark.cores.max=2).

spark.master                                  spark://spark-master:7077

# One executor per worker (worker = 2 cores / 3g).
spark.executor.memory                         3g
spark.executor.cores                          2
spark.driver.memory                           1400m

# 3 workers x 2 cores = 6 cores -> 2 x cores.
spark.sql.shuffle.partitions                  12
spark.sql.session.timeZone                    UTC

# HDFS (same values as conf/hadoop/*.xml, which is also on HADOOP_CONF_DIR).
spark.hadoop.fs.defaultFS                     hdfs://namenode:8020
spark.hadoop.dfs.client.use.datanode.hostname true

# Same interpreter on driver and executors (all run the same image).
spark.pyspark.python                          /usr/bin/python3
spark.pyspark.driver.python                   /usr/bin/python3
spark.executorEnv.PYSPARK_PYTHON              /usr/bin/python3

# Event log / history server: off for now.
spark.eventLog.enabled                        false

# Kafka source/sink. The connector jars (spark-sql-kafka-0-10, spark-token-provider-kafka-0-10,
# kafka-clients, commons-pool2) are BAKED into $SPARK_HOME/jars at image build time, resolved
# for the exact Spark version of the base image, so submits need no internet.
# Hence spark.jars.packages stays commented out. If you ever enable it, the version MUST match
# the Spark version of the image (3.5.9 -> org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9),
# and every submit will then contact Maven Central.
# spark.jars.packages                         org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
